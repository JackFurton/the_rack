# Softfloat, not plain `aarch64-unknown-none`.
#
# At reset CPACR_EL1.FPEN is 0, so any FP or SIMD instruction at EL1 traps.
# Rather than enable FP for the kernel, we compile the kernel so it never
# emits an FP instruction in the first place. Kernel code that avoids FP does
# not have to save and restore 512 bytes of vector state on every context
# switch, which is what we want by the time tier 2 has a scheduler. FP stays
# trapped and belongs to userspace.
[build]
target = "aarch64-unknown-none-softfloat"

[target.aarch64-unknown-none-softfloat]
# `cargo run` boots the kernel on the QEMU virt machine and wires its UART to
# this terminal. Ctrl-A then X quits.
#
# A script rather than a bare QEMU command line, because QEMU has to be handed
# a flat image and cargo hands the runner an ELF. `scripts/image.sh` explains
# why the difference matters: only the flat image gets a device tree.
runner = "scripts/qemu-run.sh"
