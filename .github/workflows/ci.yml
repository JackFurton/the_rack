name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  boot:
    name: builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the bare metal target
        run: rustup target add aarch64-unknown-none-softfloat

      # rust-objcopy, which scripts/image.sh uses to produce the flat binary
      # QEMU boots. The host's own objcopy does not understand aarch64 objects.
      - name: Install llvm-tools
        run: rustup component add llvm-tools

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Build
        run: cargo build

      - name: Boot under QEMU
        run: scripts/boot-test.sh

      # The memory map comes from the device tree now, so the only proof it is
      # not a constant in disguise is booting at a size the kernel was never
      # built against.
      - name: Boot with a different amount of RAM
        run: MEMORY=512M scripts/boot-test.sh

  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    # Advisory only. Style nits should never be the thing standing between you
    # and merging a change you were enjoying. The boot job is the real gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the bare metal target
        run: rustup target add aarch64-unknown-none-softfloat

      - name: Formatting
        run: cargo fmt --all --check

      # No --all-targets: the test harness needs the `test` crate, which does
      # not exist for a bare metal target.
      - name: Clippy
        run: cargo clippy -- -D warnings
